[project]
name = "time-d"
version = "0.1.0"
description = "Lightweight command timeout utility with zero dependencies"
readme = "README.md"
authors = [
  { name = "UmbrellaLeaf5" },
]
license = { text = "Unlicense" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
time-d = "time_d.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
